name: 🚀 Feature Request
description: Suggest an idea or new functionality for this project
title: "[FEATURE]: "
labels: ["enhancement"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to suggest a new feature!
        Please fill out this form to help us understand your request better.

  - type: textarea
    id: problem
    attributes:
      label: "Is your feature request related to a problem?"
      description: "A clear and concise description of what the problem is."
      placeholder: "I'm always frustrated when..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: "Describe the solution you'd like"
      description: "A clear and concise description of what you want to happen."
      placeholder: "It would be great if..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: "Describe alternatives you've considered"
      description: "A clear and concise description of any alternative solutions or features you've considered."
      placeholder: "I've thought about..."

  - type: textarea
    id: context
    attributes:
      label: "Additional context"
      description: "Add any other context, screenshots, mockups, or examples about the feature request here."
      placeholder: "Screenshots, references to similar features, etc."

  - type: checkboxes
    id: terms
    attributes:
      label: "Acknowledgement"
      options:
        - label: "I have searched the existing issues and confirmed this is not a duplicate"
          required: true
