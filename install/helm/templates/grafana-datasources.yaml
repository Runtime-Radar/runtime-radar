{{- define "cs.grafana.datasources" -}}
apiVersion: 1
datasources:
  {{- if or .Values.prometheus.deployed .Values.prometheus.externalHost }}
  - name: Prometheus
    type: prometheus
    url: {{ include "common.cs.prometheus.address" . }}
  {{- end }}
  {{- if or .Values.loki.deployed .Values.loki.externalHost }}
  - name: Loki
    type: loki
    url: {{ include "common.cs.loki.address" . }}
    jsonData:
        tlsAuthWithCACert: {{ .Values.loki.tls.certCA | empty | not }}
        tlsSkipVerify: {{ .Values.global.loki.tls.verify | not }}
        tlsAuth: false
    secureJsonData:
        tlsCACert: ${GF_LOKI_TLS_CA_CERT}
{{ end }}
{{- end -}}

{{- if .Values.grafana.deployed }}
apiVersion: v1
kind: Secret
metadata:
  name: grafana-datasources
  namespace: {{ include "common.namespace" . | quote }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with (include "common.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  datasources.yaml: {{ include "cs.grafana.datasources" . | b64enc | nindent 4 }}
{{- end }}
