{{- define "common.cs.deployment" -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "common.name" . }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with (include "common.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  replicas: {{ eq (include "common.cs.devMode.enabled" .) "true" | ternary 1 (default (.Values.global).replicas .Values.replicas) }}
  selector:
    matchLabels:
      {{- include "common.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $podAnnotations := include "common.podAnnotations" . }}
      {{- $authEnabled := eq (include "common.cs.auth.enabled" .) "true" }}
      {{- if or $podAnnotations $authEnabled }}
      annotations:
        {{- with $podAnnotations }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if $authEnabled }}
        checksum/keys: {{ default (randAlphaNum 32) ((.Values.global).keys).token | sha256sum | quote }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "common.podLabels" . | nindent 8 }}
    spec:
      enableServiceLinks: {{ eq (kindOf .Values.enableServiceLinks) "bool" | ternary .Values.enableServiceLinks false }}
      serviceAccountName: {{ include "common.cs.serviceAccountName" . }}
      {{- include "common.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.initContainers }}
      initContainers:
        {{- tpl (toYaml .Values.initContainers) . | nindent 8 -}}
      {{- end }}
      containers:
        {{- include "common.cs.container.app" . | nindent 8 -}}

        {{- if (.Values.gateway).enabled -}}
        {{- include "common.cs.container.gateway" . | nindent 8 -}}
        {{- end -}}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if ne (include "common.cs.devMode.enabled" .) "true" }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- end }}
      volumes:
        {{- include "common.cs.volumes" . | nindent 8 }}
{{- end -}}
