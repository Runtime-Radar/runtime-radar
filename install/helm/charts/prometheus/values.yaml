# @section Global parameters
global:
  # -- Global Docker image registry
  imageRegistry: ""
  # -- Global Docker registry secret names as an array
  # e.g.
  # imagePullSecrets:
  #   - myRegistryKeySecretName
  imagePullSecrets: []
  # -- Global StorageClass for Persistent Volume(s)
  storageClass: ""

  prometheus:
    tls:
      # -- [boolean, nullable] Enable TLS traffic support (overrides `tls.enabled`)
      enabled: null
      # -- [boolean, nullable] Generate automatically self-signed TLS certificates (overrides `tls.autoGenerated`)
      autoGenerated: null
      # -- Name of an existing secret that contains the certificates (overrides `tls.existingSecret`)
      existingSecret: ""
      # -- Certificate value. Requires `tls.autoGenerated` to be `false` (overrides `tls.cert`)
      cert: ""
      # -- Certificate key value. Requires `tls.autoGenerated` to be `false` (overrides `tls.certKey`)
      certKey: ""
      # -- CA Certificate value. Requires `tls.autoGenerated` to be `false` (overrides `tls.certCA`)
      certCA: ""

# @section Common parameters
# -- String to partially override common.fullname template (will maintain the release name)
nameOverride: ""
# -- String to fully override common.fullname template
fullnameOverride: ""
# -- String to fully override common.namespace
namespaceOverride: ""
# -- Kubernetes Cluster Domain
clusterDomain: cluster.local
# -- Add labels to all the deployed resources
labels: {}
# -- Add annotations to all the deployed resources
annotations: {}
# -- Global Docker registry secret names as an array
# e.g.
# imagePullSecrets:
#   - myRegistryKeySecretName
imagePullSecrets: []

# @section Prometheus parameters
# Prometheus image
image:
  # -- [default: REGISTRY_NAME] Prometheus image registry
  registry: ""
  # -- [default: REPOSITORY_NAME/redis] Prometheus image repository
  repository: prom/prometheus
  # @skip image.tag Prometheus image tag (immutable tags are recommended)
  tag: v3.4.1
  # -- Prometheus image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
  digest: ""
  # -- Prometheus image pull policy
  # Specify a imagePullPolicy
  # Defaults to 'Always' if image tag is 'latest', else set to 'IfNotPresent'
  # ref: https://kubernetes.io/docs/concepts/containers/images/#pre-pulled-images
  pullPolicy: IfNotPresent
# Authentication
auth:
  # -- Enable password authentication (currently is not supported by this chart)
  enabled: false
  # -- Prometheus username
  username: "default"
  # -- Prometheus password
  password: ""
  # -- The name of an existing secret with Prometheus credentials
  # Defaults to a random 10-character alphanumeric string if not set
  existingSecret: ""
  # -- Password key to be retrieved from existing secret
  existingSecretPasswordKey: ""
# TLS configuration
tls:
  # -- Enable TLS traffic
  enabled: false
  # -- Require clients to authenticate
  authClients: false
  # -- Enable autogenerated certificates
  autoGenerated: false
  # -- The name of the existing secret that contains the TLS certificates
  existingSecret: ""
  # -- Certificate filename
  certFilename: "tls.crt"
  # -- Certificate Key filename
  certKeyFilename: "tls.key"
  # -- CA Certificate filename
  certCAFilename: "ca.crt"
  # -- Certificate value. Requires `tls.autoGenerated` to be `false`
  cert: ""
  # -- Certificate key value. Requires `tls.autoGenerated` to be `false`
  certKey: ""
  # -- CA Certificate value. Requires `tls.autoGenerated` to be `false`
  certCA: ""
# Redis resource requests and limits
# ref: http://kubernetes.io/docs/concepts/configuration/manage-compute-resources-container/
# -- [object] Set container requests and limits for different resources like CPU or memory
resources:
  requests:
    cpu: 500m
    memory: 1024Mi
    ephemeral-storage: 50Mi
  limits:
    cpu: "1.0"
    memory: 1536Mi
    ephemeral-storage: 1024Mi
# @section Prometheus configuration parameters
# -- [string] Configuration to be added into the ConfigMap
configuration: ""
# -- The name of an existing ConfigMap with your custom configuration for Prometheus
existingConfigmap: ""
# -- Prefix for the internal routes of web endpoints
routePrefix: /
# -- The remote_write spec configuration for Prometheus
remoteWrite: []
# -- Interval between consecutive scrapes. Example: "1m"
scrapeInterval: ""
# -- Interval between consecutive scrapes. Example: "10s"
scrapeTimeout: ""
# -- Interval between consecutive evaluations. Example: "1m"
evaluationInterval: ""
# -- Enable Prometheus adminitrative API
# ref: https://prometheus.io/docs/prometheus/latest/querying/api/#tsdb-admin-apis
enableAdminAPI: false
# -- Enable Prometheus to be used as a receiver for the Prometheus remote write protocol.
enableRemoteWriteReceiver: false
# -- Enable access to Prometheus disabled features.
# ref: https://prometheus.io/docs/prometheus/latest/disabled_features/
enableFeatures: []
# -- Log level for Prometheus
logLevel: info
# -- Log format for Prometheus
logFormat: logfmt
# -- Metrics retention days
retention: 10d
# -- Maximum size of metrics
retentionSize: "0"
# -- ConfigMap which contains scrape config files
# ref: <https://prometheus.io/docs/prometheus/latest/configuration/configuration/#scrape_config>
scrapeConfigmap: ""
# -- Number of Prometheus instances to deploy
replicaCount: 1
# -- Extra labels for Prometheus master pods
# ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}
# -- Annotations for Prometheus master pods
# ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}
# -- Affinity for Prometheus master pods assignment
# ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
# NOTE: `podAffinityPreset`, `podAntiAffinityPreset`, and `nodeAffinityPreset` will be ignored when it's set
affinity: {}
# -- Node labels for Prometheus master pods assignment
# ref: https://kubernetes.io/docs/concepts/scheduling-eviction/assign-pod-node/
nodeSelector: {}
# -- Tolerations for Prometheus master pods assignment
# ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []
# -- Seconds PostgreSQL pod needs to terminate gracefully
# ref: https://kubernetes.io/docs/concepts/workloads/pods/pod/#termination-of-pods
terminationGracePeriodSeconds: ""
# -- Array with extra environment variables to add to Prometheus master nodes
# e.g:
# extraEnvVars:
#   - name: FOO
#     value: "bar"
extraEnvVars: []
# -- Optionally specify extra list of additional volumes for the Prometheus master pod(s)
volumes: []
# -- Optionally specify extra list of additional volumeMounts for the Prometheus master container(s)
volumeMounts: []
containerPorts:
  # -- Prometheus components web container port
  http: 9090
# Configure Pods Security Context
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
podSecurityContext:
  # -- Set filesystem group change policy
  fsGroupChangePolicy: Always
  # -- Set kernel settings using the sysctl interface
  sysctls: []
  # -- Set filesystem extra groups
  supplementalGroups: []
  # -- Set Prometheus master pod's Security Context fsGroup
  fsGroup: 1001
# Configure Container Security Context
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
containerSecurityContext:
  # -- [object,nullable] Set SELinux options in container
  seLinuxOptions: {}
  # -- Set Prometheus master containers' Security Context runAsUser
  runAsUser: 1001
  # -- Set Prometheus master containers' Security Context runAsGroup
  runAsGroup: 1001
  # -- Set Prometheus master containers' Security Context runAsNonRoot
  runAsNonRoot: true
  # -- Is it possible to escalate Prometheus pod(s) privileges
  allowPrivilegeEscalation: false
  # -- Set container's Security Context read-only root filesystem
  readOnlyRootFilesystem: true
  seccompProfile:
    # -- Set Prometheus master containers' Security Context seccompProfile
    type: RuntimeDefault
  capabilities:
    # -- Set Prometheus master containers' Security Context capabilities to drop
    drop: ["ALL"]
# Configure extra options for Prometheus containers' liveness and readiness probes
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-probes/#configure-probes
startupProbe:
  # -- Initial delay seconds for startupProbe
  initialDelaySeconds: 2
  # -- Period seconds for startupProbe
  periodSeconds: 5
  # -- Timeout seconds for startupProbe
  timeoutSeconds: 2
  # -- Failure threshold for startupProbe
  successThreshold: 1
  # -- Success threshold for startupProbe
  failureThreshold: 10
livenessProbe:
  # -- Initial delay seconds for livenessProbe
  initialDelaySeconds: 5
  # -- Period seconds for livenessProbe
  periodSeconds: 20
  # -- Timeout seconds for livenessProbe
  timeoutSeconds: 3
  # -- Failure threshold for livenessProbe
  successThreshold: 1
  # -- Success threshold for livenessProbe
  failureThreshold: 3
readinessProbe:
  # -- Initial delay seconds for readinessProbe
  initialDelaySeconds: 5
  # -- Period seconds for readinessProbe
  periodSeconds: 10
  # -- Timeout seconds for readinessProbe
  timeoutSeconds: 2
  # -- Failure threshold for readinessProbe
  successThreshold: 1
  # -- Success threshold for readinessProbe
  failureThreshold: 5
# @section Service Parameters
# Prometheus master service parameters
service:
  # -- Prometheus master service type
  type: ClusterIP
  ports:
    # -- Prometheus HTTP service port
    http: 9090
  # -- Additional custom annotations for Prometheus master service
  annotations: {}
  # Headless service properties
  headless:
    # -- Annotations for the headless service.
    annotations: {}
# @section Persistence Parameters
# Enable persistence using Persistent Volume Claims
# ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
persistence:
  # -- Enable persistence using Persistent Volume Claims
  enabled: true
  # -- Name of an existing PVC to use
  existingClaim: ""
  # -- Storage class of backing PVC
  # If defined, storageClassName: <storageClass>
  # If set to "-", storageClassName: "", which disables dynamic provisioning
  # If undefined (the default) or set to null, no storageClassName spec is
  #   set, choosing the default provisioner.  (gp2 on AWS, standard on
  #   GKE, AWS & OpenStack)
  storageClass: ""
  # -- Persistent Volume Claim labels
  labels: {}
  # -- Persistent Volume Claim annotations
  annotations: {}
  # -- Persistent Volume Access Modes
  accessModes:
    - ReadWriteOnce
  # -- Size of data volume
  size: 8Gi
  # -- Selector to match an existing Persistent Volume for ClickHouse data PVC
  # If set, the PVC can't have a PV dynamically provisioned for it
  # E.g.
  # selector:
  #   matchLabels:
  #     app: my-app
  selector: {}
  # -- Custom PVC data source
  dataSource: {}
  # -- PostgreSQL Persistent Volume Claim Retention Policy
  # ref: https://kubernetes.io/docs/concepts/workloads/controllers/statefulset/#persistentvolumeclaim-retention
  # Example:
  #   whenScaled: Retain
  #   whenDeleted: Retain
  persistentVolumeClaimRetentionPolicy: {}
# @section Other Parameters
# Service account
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # -- Specifies whether a ServiceAccount should be created
  create: true
  # -- The name of the ServiceAccount to use.
  # If not set and create is true, a name is generated using the common.fullname template
  name: ""
  # -- Whether to auto mount the service account token
  # ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/#use-the-default-service-account-to-access-the-api-server
  automount: true
  # -- Additional custom annotations for the ServiceAccount
  annotations: {}
# Network Policy configuration
# ref: https://kubernetes.io/docs/concepts/services-networking/network-policies/
networkPolicy:
  # -- Enable creation of NetworkPolicy resources
  enabled: true
  # -- Don't require client label for connections
  # When set to false, only pods with the correct client label will have network access to the ports
  # Prometheus is listening on. When true, Prometheus will accept connections from any source
  # (with the correct destination port).
  allowExternal: true
  # -- Allow the pod to access any range of port and all destinations.
  allowExternalEgress: true
  # -- Add extra ingress rules to the NetworkPolicy
  # e.g:
  # extraIngress:
  #   - ports:
  #       - port: 1234
  #     from:
  #       - podSelector:
  #           - matchLabels:
  #               - role: frontend
  #       - podSelector:
  #           - matchExpressions:
  #               - key: role
  #                 operator: In
  #                 values:
  #                   - frontend
  extraIngress: []
  # -- Add extra egress rules to the NetworkPolicy
  # e.g:
  # extraEgress:
  #   - ports:
  #       - port: 1234
  #     to:
  #       - podSelector:
  #           - matchLabels:
  #               - role: frontend
  #       - podSelector:
  #           - matchExpressions:
  #               - key: role
  #                 operator: In
  #                 values:
  #                   - frontend
  extraEgress: []
# RBAC configuration
rbac:
  # -- Specifies whether RBAC resources should be created
  create: true
  # -- Custom RBAC rules to set
  # e.g:
  # rules:
  #   - apiGroups:
  #       - ""
  #     resources:
  #       - pods
  #     verbs:
  #       - get
  #       - list
  rules: []

# @skip
deployed: true
