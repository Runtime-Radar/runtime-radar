{{- if not .Values.existingConfigmap }}
{{- $tlsEnabled := eq (include "common.tls.enabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "common.configmapName" . }}
  namespace: {{ include "common.namespace" . | quote }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with (include "common.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
data:
  loki.yaml: |-
    {{- if .Values.configuration }}
      {{- tpl .Values.configuration $ | nindent 6 }}
    {{- else }}
      auth_enabled: false

      server:
        http_listen_port: {{ .Values.containerPorts.http }}
        grpc_listen_port: {{ .Values.containerPorts.grpc }}
        http_server_read_timeout: 600s
        http_server_write_timeout: 600s
        {{- if $tlsEnabled }}
        http_tls_config:
          cert_file: {{ include "loki.tlsCert" . }}
          key_file: {{ include "loki.tlsCertKey" . }}
        {{- end }}

      ingester:
        chunk_encoding: snappy

      common:
        path_prefix: /var/loki
        replication_factor: 1
        ring:
          instance_addr: 127.0.0.1
          kvstore:
            store: inmemory
        storage:
          filesystem:
            chunks_directory: /var/loki/chunks
            rules_directory: /var/loki/rules

      query_scheduler:
        use_scheduler_ring: false

      limits_config:
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        volume_enabled: true
        retention_period: 336h
        allow_structured_metadata: true

      runtime_config:
        file: /etc/loki/runtime-config/runtime-config.yaml

      schema_config:
        configs:
        - from: 2024-04-23
          object_store: filesystem
          store: tsdb
          schema: v13
          index:
            prefix: loki_index_
            period: 24h

      ruler:
        storage:
          type: local
          local:
            directory: /var/loki/conf/rules

      query_range:
        align_queries_with_step: true
        max_retries: 5
        cache_results: true
        results_cache:
          cache:
            embedded_cache:
              enabled: true
              max_size_items: 1024

      storage_config:
        boltdb_shipper:
          active_index_directory: /var/loki/index
          cache_location: /var/loki/cache
          cache_ttl: 168h
        filesystem:
          directory: /var/loki/chunks
        tsdb_shipper:
          active_index_directory: /var/loki/tsdb-index
          cache_location: /var/loki/tsdb-cache
        hedging:
          at: "250ms"
          max_per_second: 20
          up_to: 3

      querier:
        # Default is 4, if you have enough memory and CPU you can increase, reduce if OOMing
        max_concurrent: 2

      index_gateway:
        mode: simple

      tracing:
        enabled: true
    {{- end }}
  runtime-config.yaml: |-
    {{- if .Values.runtimeConfig }}
      {{- tpl .Values.runtimeConfig $ | nindent 6 }}
    {{- end }}
{{- end }}
