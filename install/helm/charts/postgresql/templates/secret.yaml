{{- if and (not .Values.auth.existingSecret) (not .Values.global.postgresql.auth.existingSecret) }}
{{- $secretName := include "common.auth.secretName" . }}
{{- $key := include "postgresql.secretPasswordKey" . }}
{{- $password := include "common.secrets.password" (dict "context" . "secret" $secretName "key" $key "defaultValue" .Values.auth.password) }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ include "common.namespace" . | quote }}
  labels:
    {{- include "common.labels" . | nindent 4 }}
  {{- with (include "common.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
type: Opaque
data:
  {{ $key }}: {{ $password | b64enc | quote }}
  {{ include "postgresql.secretUserKey" . }}: {{ .Values.auth.username | b64enc | quote }}
  {{ include "postgresql.secretDatabaseKey" . }}: {{ .Values.auth.database | b64enc | quote }}
{{- end }}
