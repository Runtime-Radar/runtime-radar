<section class="shared-event-action" *transloco="let tCommon; prefix: 'common'">
    @if (blockIds?.length) {
        <kbq-badge [outline]="true"
                   [badgeColor]="badgeColors.FadeContrast"
                   [attr.data-testid]="testLocator ? testLocator + '-block-text' : ''">
            @if (isIconVisible) {
                <i kbq-icon="kbq-lock_16"></i>
            }
            {{ tCommon('Common.Pseudo.EventAction.Block') }}
        </kbq-badge>
    }
    @if (notifyIds?.length) {
        <kbq-badge [outline]="true"
                   [badgeColor]="badgeColors.FadeContrast"
                   [attr.data-testid]="testLocator ? testLocator + '-notify-text' : ''">
            @if (isIconVisible) {
                <i kbq-icon="kbq-envelope_16"></i>
            }
            {{ tCommon('Common.Pseudo.EventAction.Notify') }}
        </kbq-badge>
    }

    @if (isEmptyStateShown && !blockIds?.length && !notifyIds?.length) {
        <span>—</span>
    }
</section>
