<ng-container *transloco="let tCommon; prefix: 'common'">
    <button kbq-button
            kbqPopover
            type="button"
            #kbqPopover="kbqPopover"
            [id]="id"
            [kbqPopoverOffset]="4"
            [kbqPopoverSize]="tooltipSizes.Large"
            [kbqPopoverContent]="popoverContent"
            [kbqPopoverFooter]="popoverFooter"
            [kbqPopoverPlacement]="tooltipPlacements.BottomLeft"
            [kbqPopoverArrow]="false"
            [attr.data-testid]="testLocator + 'filter-popover-open-button'">
        <i kbq-icon="kbq-filter_16"></i>
        <span>{{ tCommon('Common.FilterPopover.Button.Filters') }}</span>
        @if (filtersCounter$ | async; as count) {
            <kbq-badge class="layout-margin-left-xxs layout-margin-right-xs"
                       [badgeColor]="badgeColors.Contrast"
                       [compact]="true">
                {{ count }}
            </kbq-badge>
        }
        @if ((isResetIconVisible$ | async) === true) {
            <button type="button"
                    class="shared-filter-popover-reset-button"
                    (click)="reset(); $event.stopPropagation()"
                    [attr.data-testid]="testLocator + 'filter-popover-reset-button'">
                <i kbq-icon="kbq-xmark-s_16"></i>
            </button>
        }
    </button>

    <ng-template #popoverContent>
        <section class="shared-filter-popover">
            <ng-content></ng-content>
        </section>
    </ng-template>

    <ng-template #popoverFooter>
        <div class="layout-row layout-align-space-between-center">
            <button kbq-button
                    type="button"
                    [disabled]="(hasChanges$ | async) === false"
                    (click)="reset()"
                    [attr.data-testid]="testLocator + 'filter-popover-reset-button'">
                {{ tCommon('Common.FilterPopover.Button.Reset') }}
            </button>

            <div class="layout-row layout-align-end-center">
                <button kbq-button
                        kbqStyle="outline"
                        color="theme-fade"
                        type="button"
                        class="layout-margin-right-l"
                        [disabled]="(hasFiltersChanges$ | async) === false"
                        (click)="confirm()"
                        [attr.data-testid]="testLocator + 'filter-popover-confirm-button'">
                    {{ tCommon('Common.FilterPopover.Button.Confirm') }}
                </button>
                <button kbq-button
                        type="button"
                        (click)="cancel()"
                        [attr.data-testid]="testLocator + 'filter-popover-cancel-button'">
                    {{ tCommon('Common.FilterPopover.Button.Cancel') }}
                </button>
            </div>
        </div>
    </ng-template>
</ng-container>
