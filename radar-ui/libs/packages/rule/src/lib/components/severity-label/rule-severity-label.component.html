<span *transloco="let tCommon; prefix: 'common'">
    <cs-rule-package-severity-component
            [severity]="severity"
            [verdict]="verdict"
            [isWidthAuto]="isWidthAuto" />
    <span class="rule-package-severity-label-text"
          severityColor
          [severity]="isLabelColored ? severity : undefined"
          [verdict]="isLabelColored ? verdict : undefined"
          [ngClass]="[severity ? severity : 'undefined']">
        @if (severity) {
            <span>{{ tCommon(severity | ruleSeverityLocalization: noneLabelLocalizationKey) }}</span>
        }
        @if (verdict) {
            <span>{{ tCommon(verdict | ruleVerdictLocalization: noneLabelLocalizationKey) }}</span>
        }
        @if (!severity && !verdict) {
            <span>{{ tCommon(noneLabelLocalizationKey || undefinedLocalizationKey) }}</span>
        }
    </span>
</span>
