<ng-container *transloco="let tInventory; prefix: 'inventory'">
    <button kbq-button
            kbqPopover
            type="button"
            #kbqPopover="kbqPopover"
            [kbqPopoverSize]="tooltipSizes.Large"
            [kbqPopoverContent]="popoverContent"
            [kbqPopoverFooter]="popoverFooter"
            data-testid="inventory-filter-popover-open-button">
        <i kbq-icon="kbq-filter_16"></i>
        <span>{{ tInventory('Inventory.FilterPopover.Button.Filters') }}</span>
        @if(filtersCounter$ | async) {
            <kbq-badge class="layout-margin-left-xxs layout-margin-right-xs"
                       [badgeColor]="badgeColors.Contrast"
                       [compact]="true">
                {{ filtersCounter$ | async }}
            </kbq-badge>
        }
        @if((isResetIconVisible$ | async) === true) {
            <button type="button"
                    class="inventory-feature-filter-popover-reset-button"
                    (click)="reset(); $event.stopPropagation()"
                    data-testid="inventory-filter-popover-reset-button">
                <i kbq-icon="kbq-xmark-s_16"></i>
            </button>
        }
    </button>

    <ng-template #popoverContent>
        <form [formGroup]="form" class="kbq-form-vertical inventory-feature-filter-popover">
            <section class="kbq-form__row kbq-form-row_margin">
                <label for="nodes" class="kbq-form__label">
                    {{ tInventory('Inventory.FilterPopover.Label.Nodes') }}
                    <i kbq-icon="kbq-question-circle_16"
                       class="cs-help-hover"
                       kbqTooltip="{{ tInventory('Inventory.FilterPopover.Hint') }}"></i>
                </label>
                <cs-tag-input-component
                        formControlName="nodes"
                        id="nodes"
                        testLocator="inventory-filter-popover-nodes-tag"
                        placeholder="{{ tInventory('Inventory.FilterPopover.Placeholder.Nodes') }}"
                        [validators]="[validators.pattern(formValidationRegExp.TEXT_SYMBOLS)]"></cs-tag-input-component>
            </section>

            <section class="kbq-form__row kbq-form-row_margin">
                <label for="namespaces" class="kbq-form__label">
                    {{ tInventory('Inventory.FilterPopover.Label.Namespaces') }}
                    <i kbq-icon="kbq-question-circle_16"
                       class="cs-help-hover"
                       kbqTooltip="{{ tInventory('Inventory.FilterPopover.Hint') }}"></i>
                </label>
                <cs-tag-input-component
                        formControlName="namespaces"
                        id="namespaces"
                        testLocator="inventory-filter-popover-namespaces-tag"
                        placeholder="{{ tInventory('Inventory.FilterPopover.Placeholder.Namespaces') }}"
                        [validators]="[validators.pattern(formValidationRegExp.TEXT_SYMBOLS)]"></cs-tag-input-component>
            </section>

            <section class="kbq-form__row kbq-form-row_margin">
                <label for="pods" class="kbq-form__label">
                    {{ tInventory('Inventory.FilterPopover.Label.Pods') }}
                    <i kbq-icon="kbq-question-circle_16"
                       class="cs-help-hover"
                       kbqTooltip="{{ tInventory('Inventory.FilterPopover.Hint') }}"></i>
                </label>
                <cs-tag-input-component
                        formControlName="pods"
                        id="pods"
                        testLocator="inventory-filter-popover-pods-tag"
                        placeholder="{{ tInventory('Inventory.FilterPopover.Placeholder.Pods') }}"
                        [validators]="[validators.pattern(formValidationRegExp.TEXT_SYMBOLS)]"></cs-tag-input-component>
            </section>

            <section class="kbq-form__row">
                <label for="containers" class="kbq-form__label">
                    {{ tInventory('Inventory.FilterPopover.Label.Containers') }}
                    <i kbq-icon="kbq-question-circle_16"
                       class="cs-help-hover"
                       kbqTooltip="{{ tInventory('Inventory.FilterPopover.Hint') }}"></i>
                </label>
                <cs-tag-input-component
                        formControlName="containers"
                        id="containers"
                        testLocator="inventory-filter-popover-containers-tag"
                        placeholder="{{ tInventory('Inventory.FilterPopover.Placeholder.Containers') }}"
                        [validators]="[validators.pattern(formValidationRegExp.TEXT_SYMBOLS)]"></cs-tag-input-component>
            </section>
        </form>
    </ng-template>

    <ng-template #popoverFooter>
        <div class="layout-row layout-align-space-between-center">
            <button kbq-button
                    type="button"
                    [disabled]="(hasChanges$ | async) === false"
                    (click)="reset()"
                    data-testid="inventory-filter-popover-reset-button">
                {{ tInventory('Inventory.FilterPopover.Button.Reset') }}
            </button>

            <div class="layout-row layout-align-end-center">
                <button kbq-button
                        kbqStyle="outline"
                        color="theme-fade"
                        type="button"
                        class="layout-margin-right-l"
                        [disabled]="(hasFiltersChanges$ | async) === false"
                        (click)="confirm()"
                        data-testid="inventory-filter-popover-confirm-button">
                    {{ tInventory('Inventory.FilterPopover.Button.Confirm') }}
                </button>
                <button kbq-button
                        type="button"
                        (click)="cancel()"
                        data-testid="inventory-filter-popover-cancel-button">
                    {{ tInventory('Inventory.FilterPopover.Button.Cancel') }}
                </button>
            </div>
        </div>
    </ng-template>
</ng-container>
