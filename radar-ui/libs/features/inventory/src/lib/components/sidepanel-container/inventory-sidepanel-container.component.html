<ng-container *transloco="let tInventory; prefix: 'inventory'">
    <kbq-sidepanel-header [closeable]="true">
        <span class="cs-text-gray">{{ tInventory('Inventory.EntitySidepanel.Title.Container') }}</span>
        {{ props.container.name }}
    </kbq-sidepanel-header>
    <kbq-sidepanel-body class="inventory-feature-sidepanel-container">
        <cs-inventory-feature-detector-table-component [detectors]="props.detectors$ | async" />
    </kbq-sidepanel-body>
</ng-container>
