<ng-container *transloco="let tRuntime; prefix: 'runtime'">
    <kbq-sidepanel-header [closeable]="true">{{ tRuntime('Runtime.PolicySidepanel.Title.Policy') }}</kbq-sidepanel-header>

    <kbq-sidepanel-body>
        <kbq-dl [vertical]="true">
            <kbq-dt>{{ tRuntime('Runtime.PolicySidepanel.Label.Name') }}</kbq-dt>
            <kbq-dd>{{ props.name }}</kbq-dd>
            <kbq-dt>{{ tRuntime('Runtime.PolicySidepanel.Label.Description') }}</kbq-dt>
            <kbq-dd>{{ props.description || '—' }}</kbq-dd>
        </kbq-dl>

        @if (props.yaml) {
            <kbq-code-block
                    canCopy
                    canDownload
                    canToggleSoftWrap
                    [lineNumbers]="true"
                    [softWrap]="false"
                    [filled]="false"
                    [files]="files"
                    class="layout-margin-top-m">
            </kbq-code-block>
        }
    </kbq-sidepanel-body>
</ng-container>
