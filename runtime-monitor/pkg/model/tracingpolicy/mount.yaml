apiVersion: cilium.io/v1alpha1
kind: TracingPolicy
metadata:
  name: "mount"
spec:
  kprobes:
  # SYNOPSIS
  # int mount(const char *source, const char *target, const char *filesystemtype, unsigned long mountflags, const void *data);
  #     @source: filesystem backing device
  #     @target: mount point
  #     @filesystemtype: filesystem type
  #     @mountflags: mount flags
  #     @data: filesystem specific data
  #
  # DESCRIPTION
  # mount() attaches the filesystem specified by source (which is often a pathname referring to a device, 
  # but can also be the pathname of a directory or file, or a dummy string) to the location (a directory or file) 
  # specified by the pathname in target.
  #
  # RETURN VALUE
  # Returns 0 if success.
  # 
  # 
  # TODO: combining a syscall kretprobe (return: true) with string args makes the Tetragon agent emit
  # "error paring arg type string / string size too large: 16777215" for __x64_sys_mount and drop the
  # source/target for some mount events. return: true is kept because the PTCS_RT_MOUNT_DEV detector needs
  # the return code (success vs failed attempt). See runtime-monitor/README.md ("Known limitation: mount").
  - call: "sys_mount"
    syscall: true
    return: true
    args:
    - index: 0
      type:  "string"
    - index: 1
      type:  "string"
    returnArg:
      index: 0
      type: "int"
